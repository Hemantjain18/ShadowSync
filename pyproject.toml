[project]
name = "lunar-matcher"
version = "0.1.0"
description = "Multi-sensor lunar image registration pipeline for Chandrayaan-2 OHRC (0.25m), TMC-2 (5m), and IIRS (80m) imagery with scale bridging, illumination normalization, and cross-validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
deep = [
    "torch>=2.0.0",
    "kornia>=0.7.0",
    "lightglue>=0.0.1",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
prepare-demo-tiles = "lunar_matcher.ingest.tiling:cli_prepare_demo_tiles"
lunar-matcher = "lunar_matcher.pipeline:cli_main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

